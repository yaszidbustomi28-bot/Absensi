<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--ac:#0f766e;--bd:#e3e6ea;--dg:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff2;--mu:#98a2ae;--ac:#2dd4bf;--bd:#2c343d;--dg:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eceff2;--mu:#98a2ae;--ac:#2dd4bf;--bd:#2c343d;--dg:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:16px;margin:0 0 12px}
p.s{color:var(--mu);margin:0 0 14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{border:1.5px dashed var(--bd);border-radius:12px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;position:relative;color:var(--mu);font-size:13px;padding:6px}
.ph img{width:100%;height:150px;object-fit:cover;border-radius:8px}
.ph b{color:var(--tx);font-size:14px;margin-bottom:2px}
.ph input{display:none}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 15px inherit;font-family:inherit;margin-top:14px;cursor:pointer}
:root[data-theme="dark"] button,button.dk{color:#06201d}
button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}
.r small{color:var(--mu);display:block}.r a{color:var(--dg);font-size:13px;cursor:pointer}
#m{font-size:13px;margin-top:10px;min-height:18px;color:var(--ac)}
</style></head><body><main>
<h1>Absensi Karyawan</h1><p class="s">Isi data, ambil foto, lalu unduh PDF bulanan.</p>
